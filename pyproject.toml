[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ossimg"
version = "0.1.0"
description = "Resize, crop, and grayscale images with three functions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Team 07" }]
dependencies = ["Pillow>=10", "numpy>=1.26"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/sujinj-hyu/ossimg"
Documentation = "https://sujinj-hyu.github.io/ossimg/"
Issues = "https://github.com/sujinj-hyu/ossimg/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ossimg"]